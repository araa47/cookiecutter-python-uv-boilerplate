---
name: Coverage Comment

on:
    workflow_run:
        workflows: [On PR]
        types: [completed]

jobs:
    comment:
        if: github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write
            actions: read
        steps:
            - name: Download coverage report
              uses: actions/download-artifact@v4
              with:
                  name: coverage-report
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ github.token }}

            - name: Download PR number
              uses: actions/download-artifact@v4
              with:
                  name: pr-number
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ github.token }}

            - name: Post coverage comment
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      const prNumber = parseInt(fs.readFileSync('pr_number.txt', 'utf8').trim());
                      const coverage = JSON.parse(fs.readFileSync('coverage.json', 'utf8'));
                      const totals = coverage.totals;
                      const pct = totals.percent_covered.toFixed(1);

                      let table = '| File | Stmts | Miss | Cover |\n';
                      table += '|------|------:|-----:|------:|\n';
                      for (const [file, data] of Object.entries(coverage.files)) {
                        const s = data.summary;
                        table += `| \`${file}\` | ${s.num_statements} | ${s.missing_lines} | ${s.percent_covered.toFixed(1)}% |\n`;
                      }
                      table += `| **Total** | **${totals.num_statements}** | **${totals.missing_lines}** | **${pct}%** |\n`;

                      const sha = '${{ github.event.workflow_run.head_sha }}'.slice(0, 7);
                      const body = `## Coverage Report\n\n${table}\n\n_Generated from commit ${sha}_`;

                      const { data: comments } = await github.rest.issues.listComments({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: prNumber,
                      });
                      const existing = comments.find(c => c.body?.includes('## Coverage Report'));

                      if (existing) {
                        await github.rest.issues.updateComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          comment_id: existing.id,
                          body,
                        });
                      } else {
                        await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: prNumber,
                          body,
                        });
                      }
